name: Marine OS CI

on:
  workflow_dispatch:
  push:
    branches: ["feature/**", "main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - run: npm ci
      - name: Sync web sources into Capacitor webDir
        run: npm run build:web
      - name: Project integrity tests
        run: npm test
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Capacitor sync
        run: npx cap sync android
      - name: Android debug build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Create build manifest
        shell: bash
        run: |
          set -euo pipefail
          printf 'commit=%s\\nbranch=%s\\nrun=%s\\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > marine-build-manifest.txt
          printf 'apk=android/app/build/outputs/apk/debug/app-debug.apk\\n' >> marine-build-manifest.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: berkah-samudera10-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            marine-build-manifest.txt
          if-no-files-found: error
          retention-days: 14
      - name: Archive full source tree
        shell: bash
        run: git archive --format=zip --output=berkah-samudera10-fullstack-source.zip HEAD -- . ':(exclude)Berkah-Samudera10-release.apk'
      - name: Verify key source files are committed and archived
        shell: bash
        run: |
          set -euo pipefail
          for path in js/device-profile.js js/map-provider-catalog.js js/safety-checklist.js js/marine-native-tracking.js scripts/check-project.mjs scripts/sync-web.mjs docs/map-provider-audit.md supabase/migrations/20261006193400_anonymous_vessel_presence.sql supabase/migrations/20261006195100_private_cloud_records.sql supabase/migrations/20261006204600_anonymous_profile_owner_writes.sql; do
            git ls-files --error-unmatch "$path" >/dev/null
            unzip -Z1 berkah-samudera10-fullstack-source.zip | grep -Fxq "$path"
          done
      - name: Upload full-stack source
        uses: actions/upload-artifact@v4
        with:
          name: berkah-samudera10-fullstack-source
          path: berkah-samudera10-fullstack-source.zip
          if-no-files-found: error
          retention-days: 30
